<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hero Section Premium</title>

  <!-- Tipografía moderna -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" type="text/css" href="css/style.css">
</head>

<body>

  <section class="hero">
    <div class="hero-container">

      <!-- CONTENIDO -->
      <div class="hero-content">
        <span class="hero-badge">Plantilla premium</span>

        <h1 class="hero-title">
          Diseña experiencias que <span>venden</span>
        </h1>

        <p class="hero-subtitle">
          Hero section moderna, limpia y altamente optimizada para convertir visitantes
          en clientes. Perfecta para productos digitales y startups.
        </p>

        <div class="hero-actions">
          <button class="btn btn-primary">Comprar plantilla</button>
          <button class="btn btn-secondary">Ver demo</button>
        </div>
      </div>

      <!-- VISUAL -->
      <div class="hero-visual">
        <div class="mockup">
          <div class="mockup-bar">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
          </div>
          <div class="mockup-content"></div>
        </div>
      </div>

    </div>
  </section>

</body>
</html>
